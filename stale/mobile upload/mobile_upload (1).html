<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrailleTouch — Manual Capture</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f6f3ec;
    color: #2b2b28;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.5rem;
    min-height: 100vh;
    margin: 0;
    box-sizing: border-box;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
  p.sub { color: #6f6a5e; font-size: 0.9rem; margin-top: 0; text-align: center; }
  input[type="file"] {
    margin: 1.5rem 0;
    font-size: 1rem;
  }
  button {
    font-size: 1.1rem;
    padding: 0.8rem 2rem;
    border-radius: 8px;
    border: 1px solid #ded6c4;
    background: #3b6e5e;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  #status {
    margin-top: 1.2rem;
    font-size: 0.95rem;
    text-align: center;
    min-height: 1.4rem;
  }
  #status.error { color: #a13d2a; }
  #preview {
    max-width: 90%;
    max-height: 300px;
    margin-top: 1rem;
    border-radius: 8px;
    border: 1px solid #ded6c4;
  }
</style>
</head>
<body>
  <h1>BrailleTouch — Manual Capture</h1>
  <p class="sub">Use this to send a photo straight to the backend, bypassing the ESP32-CAM.</p>

  <!-- capture="environment" opens the phone's camera directly on most mobile browsers -->
  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <img id="preview" style="display:none;">
  <button id="uploadBtn" disabled>Upload to backend</button>
  <p id="status"></p>

  <script>
    // IMPORTANT: this must be your backend laptop's IP on your WiFi network,
    // NOT localhost — your phone isn't the same device as your laptop.
    // Find it via ipconfig on your laptop.
    const BACKEND_URL = "http://YOUR_BACKEND_IP:8000/api/capture";

    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    let selectedFile = null;

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files[0];
      if (selectedFile) {
        preview.src = URL.createObjectURL(selectedFile);
        preview.style.display = "block";
        uploadBtn.disabled = false;
        status.textContent = "";
      }
    });

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      uploadBtn.disabled = true;
      status.classList.remove("error");
      status.textContent = "Uploading and processing (OCR + AI can take several seconds)...";

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "image/jpeg" },
          body: selectedFile, // sends the raw image bytes, same as the ESP32-CAM does
        });

        if (res.ok) {
          status.textContent = "Uploaded successfully — check the dashboard for results.";
        } else {
          status.classList.add("error");
          status.textContent = `Backend responded with an error (${res.status}).`;
        }
      } catch (e) {
        status.classList.add("error");
        status.textContent = "Could not reach the backend. Check BACKEND_URL and that you're on the same WiFi.";
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
